<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoomScan AR - GPS Real</title>
    <style>
        body {
            margin: 0;
            background: #0B0F19;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        .box {
            background: #111827;
            border: 1px solid #0e7490;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h3 { color: #00f2fe; margin-top: 0; }
        .data {
            background: #1E293B;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            font-family: monospace;
            font-size: 13px;
            color: #38bdf8;
            text-align: left;
            word-break: break-all;
        }
        button {
            background: #00f2fe;
            color: #000;
            border: none;
            padding: 14px;
            font-weight: bold;
            border-radius: 10px;
            width: 100%;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
        }
        .btn-sec { background: #1E293B; color: #fff; box-shadow: none; }
        .btn-save { background: #4ade80; display: none; }
        #status { font-size: 12px; color: #facc15; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h3>🛰️ Geolocalización en Vivo</h3>
        <div id="status">Toca el botón para autorizar el GPS de tu dispositivo.</div>
        
        <div class="data" id="output">
            Latitud: Esperando...<br>
            Longitud: Esperando...<br>
            Precisión: ---
        </div>

        <button onclick="getGPS()">📍 Capturar Ubicación Real</button>
        <button id="btn-enviar" class="btn-save" onclick="guardarYContinuar()">Guardar en la Base de Datos ➔</button>
        <button class="btn-sec" onclick="window.location.href='/scan'">Volver a la App</button>
    </div>

    <script>
        let latReal = 18.334703;
        let lonReal = -93.206845;

        function getGPS() {
            const status = document.getElementById('status');
            const output = document.getElementById('output');
            const btnEnviar = document.getElementById('btn-enviar');

            if (!navigator.geolocation) {
                status.innerText = "Geolocalización no soportada por este navegador.";
                status.style.color = "#f87171";
                return;
            }

            status.innerText = "Buscando satélites GPS...";
            status.style.color = "#facc15";

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    latReal = pos.coords.latitude;
                    lonReal = pos.coords.longitude;
                    const acc = pos.coords.accuracy.toFixed(1);

                    status.innerText = "¡Ubicación Real Obtenida con Éxito!";
                    status.style.color = "#4ade80";
                    
                    // Corrección limpia de sintaxis para evitar errores en móviles
                    output.innerHTML = 
                        "<b>Latitud:</b> " + latReal.toFixed(6) + "<br>" +
                        "<b>Longitud:</b> " + lonReal.toFixed(6) + "<br>" +
                        "<b>Precisión:</b> ±" + acc + "m";
                    
                    btnEnviar.style.display = 'block';
                },
                (err) => {
                    status.innerText = "Error GPS: Permiso denegado o inactivo.";
                    status.style.color = "#f87171";
                    output.innerHTML = "<b>Nota:</b> " + err.message + "<br><br><i>En iPhone ve a Ajustes > Safari > Ubicación y asegúrate de permitirla.</i>";
                },
                { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
            );
        }

        function guardarYContinuar() {
            // Redirige de vuelta a la app de Flet enviando los parámetros reales
            window.location.href = "/geo?lat=" + latReal + "&lon=" + lonReal;
        }
    </script>
</body>
</html>
