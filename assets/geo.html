<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Real</title>
    <style>
        body {
            margin: 0;
            background: #0B0F19;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        .box {
            background: #111827;
            border: 1px solid #0e7490;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h3 { color: #00f2fe; margin-top: 0; }
        .data {
            background: #1E293B;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            font-family: monospace;
            font-size: 13px;
            color: #38bdf8;
            text-align: left;
        }
        button {
            background: #00f2fe;
            color: #000;
            border: none;
            padding: 14px;
            font-weight: bold;
            border-radius: 10px;
            width: 100%;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-sec { background: #1E293B; color: #fff; }
        #status { font-size: 12px; color: #facc15; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h3>🛰️ Conexión GPS Satelital</h3>
        <div id="status">Presiona el botón para autorizar la lectura de tu GPS real.</div>
        
        <div class="data" id="output">
            Latitud: ---<br>
            Longitud: ---<br>
            Precisión: ---
        </div>

        <button onclick="getGPS()">📍 Capturar Mi Ubicación Real</button>
        <button class="btn-sec" onclick="window.location.href='/'">Volver a la App</button>
    </div>

    <script>
        function getGPS() {
            const status = document.getElementById('status');
            const output = document.getElementById('output');

            if (!navigator.geolocation) {
                status.innerText = "Error: Geolocalización no soportada en este navegador.";
                status.style.color = "#f87171";
                return;
            }

            status.innerText = "Solicitando coordenadas exactas al chip GPS...";
            status.style.color = "#facc15";

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    status.innerText = "¡Ubicación Satelital Confirmada!";
                    status.style.color = "#4ade80";
                    output.innerHTML = `
                        <b>Latitud:</b> ${pos.coords.latitude.toFixed(6)}<br>
                        <b>Longitud:</b> ${pos.coords.longitude.toFixed(6)}<br>
                        <b>Precisión:</b> ±${pos.coords.accuracy.toFixed(1)} metros
                    `;
                },
                (err) => {
                    status.innerText = "Error al obtener ubicación.";
                    status.style.color = "#f87171";
                    output.innerHTML = `<b>Mensaje:</b> ${err.message}<br><br><i>Asegúrate de permitir la ubicación en la barra de direcciones de tu navegador.</i>`;
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }
    </script>
</body>
</html>
