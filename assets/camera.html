<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Cámara Real</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #0B0F19;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #video-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .controls {
            position: absolute;
            bottom: 30px;
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 20;
        }
        button {
            background: #00f2fe;
            color: #000;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
        }
        .btn-secondary {
            background: #1E293B;
            color: #fff;
            box-shadow: none;
        }
        #status-log {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            color: #38bdf8;
            display: none;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div id="video-container">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="controls">
            <div id="status-log"></div>
            <button id="btn-start" onclick="initCam()">📷 Abrir Cámara del Celular</button>
            <button class="btn-secondary" onclick="window.location.href='/'">Volver a la App</button>
        </div>
    </div>

    <script>
        async function initCam() {
            const video = document.getElementById('webcam');
            const btn = document.getElementById('btn-start');
            const log = document.getElementById('status-log');

            log.style.display = 'block';
            log.innerText = "Solicitando permisos de cámara al sistema operativo...";

            try {
                // Intentar primero cámara trasera, si falla usar cualquier cámara disponible
                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: { ideal: "environment" } },
                        audio: false
                    });
                } catch (e) {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                }

                video.srcObject = stream;
                await video.play();
                
                log.style.color = "#4ade80";
                log.innerText = "¡Cámara activa en vivo!";
                btn.style.display = 'none';
            } catch (err) {
                console.error(err);
                log.style.color = "#f87171";
                log.innerHTML = "<b>Error al abrir cámara:</b> " + err.message + 
                    "<br><br><b>Solución:</b> Revisa los permisos de tu navegador en Ajustes > Privacidad > Cámara.";
                btn.innerText = "Reintentar";
            }
        }
    </script>
</body>
</html>
