<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoomScan AR - Cámara Real</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #0B0F19;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px 0;
        }
        video {
            width: 100%;
            height: 60vh;
            background: #000;
            border-radius: 14px;
            object-fit: cover;
            border: 1px solid #0e7490;
        }
        .controls { display: flex; flex-direction: column; gap: 10px; }
        button {
            background: #00f2fe;
            color: #000;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
        }
        .btn-sec { background: #1E293B; color: #fff; box-shadow: none; }
        .btn-success { background: #4ade80; display: none; }
        #status-log {
            background: #1E293B;
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 8px;
            font-size: 11px;
            color: #38bdf8;
            font-family: monospace;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <h3 style="color: #00f2fe; margin: 0; text-align: center; font-size: 16px;">📷 Cámara en Vivo (iPhone / PC)</h3>
        
        <video id="webcam" autoplay playsinline muted></video>

        <div id="status-log">Estado: Pulsa encender para activar la cámara.</div>

        <div class="controls">
            <button id="btn-start" onclick="initCam()">Encender Cámara</button>
            <button id="btn-capture" class="btn-success" onclick="siguientePaso()">Continuar a GPS ➔</button>
            <button class="btn-sec" onclick="window.location.href='/scan'">Volver a la App</button>
        </div>
    </div>

    <script>
        async function initCam() {
            const video = document.getElementById('webcam');
            const log = document.getElementById('status-log');
            const btnStart = document.getElementById('btn-start');
            const btnCapture = document.getElementById('btn-capture');

            log.innerText = "Solicitando permisos de cámara en Safari/Chrome...";

            // Configuración segura compatible con iPhone y Laptops
            const constraints = {
                video: { facingMode: { exact: "environment" } }, // Intenta cámara trasera pura
                audio: false
            };

            try {
                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (e) {
                    // Si el dispositivo no soporta 'exact: environment', usa genérica o frontal trasera
                    stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                }

                video.srcObject = stream;
                await video.play();
                
                log.style.color = "#4ade80";
                log.innerText = "¡Cámara activa en tiempo real!";
                btnStart.style.display = 'none';
                btnCapture.style.display = 'block';
            } catch (err) {
                console.error(err);
                log.style.color = "#f87171";
                log.innerText = "Error: " + err.message + ". Verifica que Safari tenga permiso de Cámara en los Ajustes de tu iPhone.";
            }
        }

        function siguientePaso() {
            window.location.href = '/geo.html';
        }
    </script>
</body>
</html>
